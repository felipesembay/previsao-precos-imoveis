# ─── Rede compartilhada ───────────────────────────────────────────────────────
networks:
  monitoring:
    driver: bridge
  # Rede do container PostgreSQL (projeto datastacktrendsanalyzer). No Azure, troque PG_HOST e remova esta rede.
  postgres_externo:
    external: true
    name: datastacktrendsanalyzer_default

# ─── Volumes persistentes ─────────────────────────────────────────────────────
volumes:
  prometheus_data:
  grafana_data:

# ─── Serviços ─────────────────────────────────────────────────────────────────
services:

  # ── Prometheus Exporter (Python) ───────────────────────────────────────────
  prometheus_exporter:
    build:
      context: ../..
      dockerfile: monitoring/docker/Dockerfile.exporter
    container_name: drift_exporter
    restart: unless-stopped
    # PG_USER, PG_PASSWORD e PG_DB vêm do .env (sem senha no YAML)
    env_file:
      - ../../streamlit_app/.env
    environment:
      PG_HOST: datastacktrendsanalyzer-postgres-1   # nome do container na rede postgres_externo
      PG_PORT: 5432
      EXPORTER_PORT: 8007
      EXPORTER_POLL_SECONDS: 60
    ports:
      - "8007:8007"
    networks:
      - monitoring
      - postgres_externo

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    depends_on:
      - prometheus_exporter
    networks:
      - monitoring

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # SMTP para alertas por e-mail (preencha com suas credenciais)
      GF_SMTP_ENABLED: "false"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ""
      GF_SMTP_PASSWORD: ""
      GF_SMTP_FROM_ADDRESS: alertas@seuprojeto.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring
