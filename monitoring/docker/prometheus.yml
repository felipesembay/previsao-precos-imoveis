global:
  scrape_interval: 60s
  evaluation_interval: 60s

# ── Regras de alerta ──────────────────────────────────────────────────────────
rule_files:
  - "alerts.yml"

# ── Alertmanager (envia os alertas por e-mail) ────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# ── Scrape config ─────────────────────────────────────────────────────────────
scrape_configs:

  - job_name: "drift_exporter"
    static_configs:
      - targets: ["prometheus_exporter:8007"]
    metrics_path: /metrics
    scrape_interval: 60s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
